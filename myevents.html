<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>

        <title>Campus Event and Workshop Hub</title>
    </head>
    <body>
        <header>
            <h1>Campus Event and Workshop Hub</h1>
            <button id='mockBtn'>Reset Mock Data</button>
            <nav>
                <ul id='navList'>
                </ul>
            </nav>
        </header>
        <main>
            <form id='listControl'>
                <fieldset>
                    <legend>Sort by:</legend>
                    <input type="radio" id="name" name="sorting" value="name" />
                    <label for="name">Name</label>
                    <input type="radio" id="date" name="sorting" value="date" />
                    <label for="date">Date</label>
                    <input type="radio" id="participants" name="sorting" value="participants" />
                    <label for="participants">Participants</label>
                </fieldset>
            </form>
            <ul id='filteredEventList'>
            </ul>
        </main>
    </body>
</html>
